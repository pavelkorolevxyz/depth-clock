[project]
name = "depth-clock"
version = "0.1.0"
description = "A desktop clock set behind the foreground of the wallpaper"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Topic :: Desktop Environment",
]
dependencies = [
  "numpy>=2.0",
  "pillow>=11.0",
  "scipy>=1.14",
  "onnxruntime>=1.20",
]

[project.scripts]
depth-clock = "depth_clock.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
