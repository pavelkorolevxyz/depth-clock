name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fontconfig
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python tests
        run: uv run --frozen pytest -q
      - name: Snapping tests
        run: node --test tests/snap.test.mjs
